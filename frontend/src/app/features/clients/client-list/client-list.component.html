<div class="space-y-6">
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Clientes</h1>
            <p class="mt-1 text-sm text-gray-600">Gerencie os clientes do estacionamento</p>
        </div>
        <button (click)="openModal()"
            class="inline-flex items-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 transition-colors">
            <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Novo Cliente
        </button>
    </div>

    <!-- Search -->
    <div class="bg-white rounded-lg shadow-sm p-4">
        <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="filterClients()"
            placeholder="Buscar por nome, CPF ou email..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent">
    </div>

    <!-- Table -->
    <div *ngIf="!loading" class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">CPF</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Telefone
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status
                    </th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Ações
                    </th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let client of filteredClients" class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">{{ client.name }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">{{ client.cpf }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">{{ client.email }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">{{ client.phone }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 text-xs font-semibold rounded-full"
                            [class.bg-success-100]="client.isActive" [class.text-success-800]="client.isActive"
                            [class.bg-gray-100]="!client.isActive" [class.text-gray-800]="!client.isActive">
                            {{ client.isActive ? 'Ativo' : 'Inativo' }}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                        <button (click)="openModal(client)"
                            class="text-primary-600 hover:text-primary-900">Editar</button>
                        <button (click)="toggleActive(client)" class="text-primary-600 hover:text-primary-900">{{
                            client.isActive ? 'Desativar' : 'Ativar' }}</button>
                        <button (click)="deleteClient(client.id!)"
                            class="text-danger-600 hover:text-danger-900">Excluir</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal -->
    <div *ngIf="showModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
        (click)="closeModal()">
        <div class="relative top-20 mx-auto p-5 border w-full max-w-md shadow-lg rounded-lg bg-white"
            (click)="$event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900">{{ isEditing ? 'Editar Cliente' : 'Novo Cliente' }}</h3>
                <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">X</button>
            </div>
            <form [formGroup]="clientForm" (ngSubmit)="onSubmit()" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome</label>
                    <input type="text" formControlName="name" class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">CPF</label>
                    <input type="text" formControlName="cpf" class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" formControlName="email" class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Telefone</label>
                    <input type="text" formControlName="phone" class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div class="flex items-center">
                    <input type="checkbox" formControlName="isActive"
                        class="h-4 w-4 text-primary-600 border-gray-300 rounded">
                    <label class="ml-2 block text-sm text-gray-700">Ativo</label>
                </div>
                <div class="flex space-x-3 pt-4">
                    <button type="button" (click)="closeModal()"
                        class="flex-1 px-4 py-2 border rounded-lg">Cancelar</button>
                    <button type="submit" [disabled]="clientForm.invalid"
                        class="flex-1 px-4 py-2 bg-primary-600 text-white rounded-lg">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
