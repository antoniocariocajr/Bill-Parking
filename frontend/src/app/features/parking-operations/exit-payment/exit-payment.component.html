<div class="max-w-2xl mx-auto" *ngIf="session && !loading">
    <div class="bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="bg-primary-600 px-6 py-4">
            <h1 class="text-xl font-bold text-white">Pagamento e Saída</h1>
            <p class="text-primary-100">Resumo da estadia</p>
        </div>

        <div class="p-6 space-y-6">
            <!-- Details -->
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <p class="text-xs text-gray-500 uppercase">Veículo</p>
                    <p class="font-medium text-lg">{{ session.vehicle.licensePlate }}</p>
                    <p class="text-sm text-gray-600">{{ session.vehicle.model }}</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase">Vaga</p>
                    <p class="font-medium text-lg">{{ session.spot.code }}</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase">Entrada</p>
                    <p class="font-medium">{{ session.entryTime | date:'dd/MM HH:mm' }}</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase">Duração</p>
                    <p class="font-medium">{{ (duration / 60).toFixed(1) }} horas</p>
                </div>
            </div>

            <div class="border-t pt-4">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-lg font-medium text-gray-900">Total a Pagar</span>
                    <span class="text-3xl font-bold text-primary-600">R$ {{ amount.toFixed(2) }}</span>
                </div>

                <!-- Payment Method -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Forma de Pagamento</label>
                    <select [(ngModel)]="selectedMethod" class="w-full px-3 py-2 border rounded-lg">
                        <option *ngFor="let method of paymentMethods" [value]="method">{{ method }}</option>
                    </select>
                </div>

                <button (click)="confirmExit()" [disabled]="processingPayment"
                    class="w-full btn-primary py-3 bg-success-600 hover:bg-success-700 text-white rounded-lg font-bold text-lg shadow-md disabled:opacity-50">
                    {{ processingPayment ? 'Processando...' : 'Confirmar Pagamento' }}
                </button>
            </div>
        </div>
    </div>
</div>
