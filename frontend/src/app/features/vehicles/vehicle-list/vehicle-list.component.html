<div class="space-y-6">
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Veículos</h1>
            <p class="mt-1 text-sm text-gray-600">Gerencie os veículos cadastrados</p>
        </div>
        <button (click)="openModal()"
            class="inline-flex items-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 transition-colors">
            <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Novo Veículo
        </button>
    </div>

    <!-- Search -->
    <div class="bg-white rounded-lg shadow-sm p-4">
        <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="filterVehicles()"
            placeholder="Buscar por placa ou modelo..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent">
    </div>

    <!-- Table -->
    <div *ngIf="!loading" class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Placa
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Modelo
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cor</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tipo</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Ações
                    </th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let vehicle of filteredVehicles" class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">{{ vehicle.licensePlate }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">{{ vehicle.model }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">{{ vehicle.color }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">{{ vehicle.type }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                        <button (click)="openModal(vehicle)"
                            class="text-primary-600 hover:text-primary-900">Editar</button>
                        <button (click)="deleteVehicle(vehicle.id!)"
                            class="text-danger-600 hover:text-danger-900">Excluir</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal -->
    <div *ngIf="showModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
        (click)="closeModal()">
        <div class="relative top-20 mx-auto p-5 border w-full max-w-md shadow-lg rounded-lg bg-white"
            (click)="$event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900">{{ isEditing ? 'Editar Veículo' : 'Novo Veículo' }}</h3>
                <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">X</button>
            </div>
            <form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Placa</label>
                    <input type="text" formControlName="licensePlate"
                        class="w-full px-3 py-2 border rounded-lg uppercase" placeholder="ABC-1234">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Modelo</label>
                    <input type="text" formControlName="model" class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Cor</label>
                    <input type="text" formControlName="color" class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Tipo</label>
                    <select formControlName="type" class="w-full px-3 py-2 border rounded-lg">
                        <option *ngFor="let type of vehicleTypes" [value]="type">{{ type }}</option>
                    </select>
                </div>
                <!-- Owner Selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Proprietário (Cliente)</label>
                    <select formControlName="clientId" class="w-full px-3 py-2 border rounded-lg">
                        <option value="">Selecione...</option>
                        <option *ngFor="let client of clients" [value]="client.id">{{ client.name }} - {{ client.cpf }}
                        </option>
                    </select>
                </div>

                <div class="flex space-x-3 pt-4">
                    <button type="button" (click)="closeModal()"
                        class="flex-1 px-4 py-2 border rounded-lg">Cancelar</button>
                    <button type="submit" [disabled]="vehicleForm.invalid"
                        class="flex-1 px-4 py-2 bg-primary-600 text-white rounded-lg">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
